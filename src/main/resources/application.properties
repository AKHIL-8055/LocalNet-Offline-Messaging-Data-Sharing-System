# Server Configuration
server.port=8080
spring.application.name=HelpHub

# SQLite Database
spring.datasource.url=jdbc:sqlite:helphub.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# Upload Directory
app.upload.dir=uploads

# JWT Secret (change in production)
jwt.secret=helphub-emergency-secret-key-change-in-production-2024
jwt.expiration=86400000

# Server Name
app.server.name=Camp Alpha

# CORS (for development - allow all origins for offline use)
spring.web.cors.allowed-origins=*



